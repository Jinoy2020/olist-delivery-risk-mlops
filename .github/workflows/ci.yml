
name: Olist Delivery Risk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    env:
      MODEL_PATH: ${{ github.workspace }}/docker_model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest==9.1.1

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py -v

  feast-test:
    name: Feast Feature Store Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Feast dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-feast-ci.txt

      - name: Run Data and Feast tests
        run: |
          python -m pytest \
            tests/test_data_validation.py \
            tests/test_feature_engineering.py \
            tests/test_feast_ci.py \
            tests/test_pipeline.py \
            -v
